name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uno
          POSTGRES_PASSWORD: uno_dev_password
          POSTGRES_DB: uno_ultra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uno -d uno_ultra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint 9)
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Run unit & integration tests (shared, server, client)
        run: npm run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run 2-context matchmaking Playwright E2E test
        env:
          E2E_USE_REAL_INFRA: 'true'
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          POSTGRES_USER: uno
          POSTGRES_PASSWORD: uno_dev_password
          POSTGRES_DB: uno_ultra
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts & traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Production dependency audit (non-blocking summary)
        run: npm audit --omit=dev --audit-level=high || true
