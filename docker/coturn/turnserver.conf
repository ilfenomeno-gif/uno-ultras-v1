# UNO ULTRA — CoTURN (STUN/TURN over TCP + UDP)
# Development baseline: in production, docker-compose.prod.yml overrides
# credentials via --use-auth-secret + ${TURN_AUTH_SECRET} and enforces strict quotas.

listening-port=3478
tls-listening-port=5349

# In Docker Desktop (Windows), external-ip must be set to the host IP
# for TURN relay to work across NAT. Override in production.
# external-ip=YOUR_PUBLIC_IP

realm=uno-ultra.local
server-name=uno-ultra.local

# Long-term credential mechanism (local dev default; overridden in production)
lt-cred-mech
user=uno:uno_turn_password

# UDP relay ports (must match docker-compose mapping)
min-port=49160
max-port=49200

# Resource & bandwidth quotas
total-quota=100
user-quota=12
max-bps=640000

# Logging
log-file=stdout
verbose

# SSRF & Abuse Hardening (block loopback & private RFC1918/ULA ranges)
fingerprint
no-loopback-peers
no-multicast-peers
no-cli
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
