# UNO ULTRA — CoTURN (STUN/TURN over TCP + UDP)

listening-port=3478
tls-listening-port=5349

# In Docker Desktop (Windows), external-ip must be set to the host IP
# for TURN relay to work across NAT. Override in production.
# external-ip=YOUR_PUBLIC_IP

realm=uno-ultra.local
server-name=uno-ultra.local

# Long-term credential mechanism
lt-cred-mech
user=uno:uno_turn_password

# UDP relay ports (must match docker-compose mapping)
min-port=49160
max-port=49200

# Logging
log-file=stdout
verbose

# Security hardening
fingerprint
no-multicast-peers
no-cli