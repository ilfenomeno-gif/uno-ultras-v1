name: uno-ultra

networks:
  uno-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  redisdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: uno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks: [uno-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uno-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redisdata:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks: [uno-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: production
    container_name: uno-server
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WS_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
    ports:
      - "${WS_PORT:-3000}:3000"
      - "${UDP_TELEMETRY_PORT:-41234}:41234/udp"
      - "${WEBRTC_UDP_MIN:-19302}-${WEBRTC_UDP_MAX:-19312}:19302-19312/udp"
    networks: [uno-net]

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: uno-coturn
    restart: unless-stopped
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    ports:
      - "${STUN_PORT:-3478}:3478/tcp"
      - "${STUN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-5349}:5349/tcp"
      - "${TURN_PORT:-5349}:5349/udp"
      - "${TURN_RELAY_MIN:-49160}-${TURN_RELAY_MAX:-49200}:49160-49200/udp"
    networks: [uno-net]

  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
      target: production
    container_name: uno-client
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [uno-net]